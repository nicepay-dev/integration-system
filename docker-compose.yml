services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: merchant_pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345678}
    volumes:
      - merchant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d merchant_pulse"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks:
      internal:
        aliases:
          - database
    restart: unless-stopped

  backend:
    image: merchant-pulse-backend:latest
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      DB_SYNCHRONIZE: "true"
      PORT: 3000
      DB_HOST: database
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-12345678}
      DB_DATABASE: merchant_pulse
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      FRONTEND_URL: http://localhost:${APP_PORT:-5173}
    depends_on:
      database:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    image: merchant-pulse-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${APP_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal
      - cloudflare
    restart: unless-stopped

volumes:
  merchant_data:
    name: merchant_pulse_postgres_data

networks:
  internal:
    name: ${INTERNAL_NETWORK:-nicepay_integration_internal}
    driver: bridge
  cloudflare:
    name: ${CLOUDFLARE_NETWORK:-cloudflared}
    external: true
