services:
  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: merchant_pulse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-12345678}
    volumes:
      - merchant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d merchant_pulse"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    image: merchant-pulse-backend:latest
    build:
      context: ./backend
    environment:
      NODE_ENV: production
      DB_SYNCHRONIZE: "true"
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-12345678}@database:5432/merchant_pulse
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-before-production}
      FRONTEND_URL: http://localhost:${APP_PORT:-5173}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/users').then(()=>process.exit(0)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    image: merchant-pulse-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports:
      - "${APP_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  merchant_data:
    name: merchant_pulse_postgres_data
